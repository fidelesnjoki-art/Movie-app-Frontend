name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feature/**"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      # I will Uncomment if and when i  add tests Vitest or  Jest to my project
      # - name: Run tests
      #   run: npm test
